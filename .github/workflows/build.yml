name: Build Fortremote Docker Image

on:
  push:
    branches:
      - main
      - containerization

env:
  IMAGE_NAME: ${{ vars.IMAGE_NAME}}
  REGISTRY: ghcr.io

jobs:
  Build:
    runs-on: ubuntu-latest
    env:
      REPO_OWNER: $(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Build Docker Image
        run: |
          docker build -t ghcr.io/${{ env.REPO_OWNER }}/fortremote:latest -t ghcr.io/${{ env.REPO_OWNER }}/fortremote:${{ github.sha }} .

      - name: Login to GitHub Container Registry
        run: echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
      
      - name: Push Docker Image to GHCR
        run: |
          docker push ghcr.io/${{ env.REPO_OWNER }}/fortremote:latest
          docker push ghcr.io/${{ env.REPO_OWNER }}/fortremote:${{ github.sha }}

  Deploy:
    runs-on: ubuntu-latest
    needs: Build
    steps: 
      - name: Install server SSH keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ vars.SERVER_HOST }} > ~/.ssh/known_hosts
      
      - name: Connect to server and Deploy
        run: |
          ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ vars.SERVER_HOST }} << 'EOF'
            set -e

            echo "Logging into GitHub Container Registry..."
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

            # Create work directory if it doesn't exist
            if [ ! -d ${{ vars.WORK_DIR }} ]; then
              mkdir -p ~/${{ vars.WORK_DIR }}
              
              # Set permissions
              chmod 0750 ${{ vars.WORK_DIR }}
              
              cd ${{ vars.WORK_DIR }}

              # Downloading docker-compose.yml from the repo
              curl -fsSL -H "Authorization: token ${{ secrets.GHCR_PAT }}" \
                -H "Accept: application/vnd.github.v3.raw" \
                -o ./docker-compose.yml \
                "https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.yml?ref=${{ github.sha }}"

              # Set proper permissions on the compose file
              chmod 0640 ./docker-compose.yml
              
              echo "Starting Container ..."
              docker compose up -d
            else
              cd ${{ vars.WORK_DIR }}
              
              echo "Stop containers!!"
              docker compose down

              echo "Download latest docker-compose.yaml ..."
              curl -fsSL -H "Authorization: token ${{ secrets.GHCR_PAT }}" \
                -H "Accept: application/vnd.github.v3.raw" \
                -o ./docker-compose.yml \
                "https://api.github.com/repos/${{ github.repository }}/contents/docker-compose.yml?ref=${{ github.sha }}"

              # Set proper permissions on the compose file
              chmod 0640 ./docker-compose.yml
              
              echo "Pulling latest container ..."
              docker compose pull fortremote

              echo "Restarting the container ..."
              docker compose up -d --force-recreate --no-deps fortremote
              
              echo "Docker clean Up ..."
              docker system prune -af
            fi
          EOF

      - name: CleanUp
        if: always() # Run regardless of job success
        run: rm -rf ~/.ssh